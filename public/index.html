<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>MONOPOLY Big Baller Live Tracker</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 14px;
      background: #0b1120;
      color: #ffffff;
      font-family: Arial, sans-serif;
    }

    .container {
      width: 100%;
      max-width: 1200px;
      margin: auto;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 20px;
      margin: 0;
      color: #facc15;
    }

    .subtitle {
      color: #94a3b8;
      font-size: 12px;
      margin-top: 6px;
    }

    button {
      cursor: pointer;
      border: none;
      border-radius: 7px;
      padding: 9px 13px;
      font-size: 12px;
      font-weight: bold;
    }

    .refresh-btn {
      background: #eab308;
      color: #111827;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-bottom: 20px;
    }

    .card {
      background: #172033;
      border: 1px solid #263449;
      border-radius: 10px;
      padding: 14px;
      min-width: 0;
    }

    .card-title {
      color: #94a3b8;
      font-size: 11px;
      margin-bottom: 8px;
    }

    .card-value {
      font-size: 24px;
      font-weight: bold;
      color: #ffffff;
    }

    .section {
      background: #111b2e;
      border: 1px solid #263449;
      border-radius: 10px;
      padding: 13px;
      margin-bottom: 18px;
      min-width: 0;
    }

    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 14px;
    }

    h2 {
      font-size: 16px;
      margin: 0;
    }

    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 14px;
    }

    .filter-btn {
      background: #263449;
      color: #cbd5e1;
      padding: 8px 11px;
    }

    .filter-btn.active {
      background: #eab308;
      color: #111827;
    }

    .table-wrap {
      width: 100%;
      overflow: hidden;
    }

    table {
      width: 100%;
      min-width: 0;
      border-collapse: collapse;
      table-layout: fixed;
    }
