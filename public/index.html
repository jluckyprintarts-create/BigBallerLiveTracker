<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>MONOPOLY Big Baller Live Tracker</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 14px;
      background: #0b1120;
      color: #ffffff;
      font-family: Arial, sans-serif;
    }

    .container {
      width: 100%;
      max-width: 1200px;
      margin: auto;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 20px;
      margin: 0;
      color: #facc15;
    }

    .subtitle {
      color: #94a3b8;
      font-size: 12px;
      margin-top: 6px;
    }

    button {
      cursor: pointer;
      border: none;
      border-radius: 7px;
      padding: 9px 13px;
      font-size: 12px;
      font-weight: bold;
    }

    .refresh-btn {
      background: #eab308;
      color: #111827;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-bottom: 20px;
    }

    .card {
      background: #172033;
      border: 1px solid #263449;
      border-radius: 10px;
      padding: 14px;
      min-width: 0;
    }

    .card-title {
      color: #94a3b8;
      font-size: 11px;
      margin-bottom: 8px;
    }

    .card-value {
      font-size: 24px;
      font-weight: bold;
      color: #ffffff;
    }

    .section {
      background: #111b2e;
      border: 1px solid #263449;
      border-radius: 10px;
      padding: 13px;
      margin-bottom: 18px;
      min-width: 0;
    }

    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 14px;
    }

    h2 {
      font-size: 16px;
      margin: 0;
    }

    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 14px;
    }

    .filter-btn {
      background: #263449;
      color: #cbd5e1;
      padding: 8px 11px;
    }

    .filter-btn.active {
      background: #eab308;
      color: #111827;
    }

    .table-wrap {
      width: 100%;
      overflow: hidden;
    }

    table {
      width: 100%;
      min-width: 0;
      border-collapse: collapse;
      table-layout: fixed;
    }

    th,
    td {
      padding: 9px 4px;
      text-align: left;
      border-bottom: 1px solid #263449;
      font-size: 10px;
      line-height: 1.4;
      overflow-wrap: anywhere;
      word-break: break-word;
    }

    th {
      color: #94a3b8;
      font-weight: bold;
      background: #172033;
    }

    td {
      color: #e2e8f0;
    }

    .empty {
      text-align: center;
      color: #94a3b8;
      padding: 22px 5px;
    }

    .type-badge {
      display: inline-block;
      padding: 4px 5px;
      border-radius: 5px;
      font-size: 9px;
      font-weight: bold;
      background: #334155;
      color: #ffffff;
    }

    .badge-three {
      background: #1d4ed8;
    }

    .badge-five {
      background: #7c3aed;
    }

    .multiplier {
      color: #facc15;
      font-weight: bold;
    }

    .pagination {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 18px;
    }

    .pagination button {
      padding: 8px 12px;
      font-size: 12px;
      min-width: 36px;
      background: #263449;
      color: #ffffff;
    }

    .pagination button.active {
      background: #eab308;
      color: #111827;
    }

    .pagination button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .hourly-list {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }

    .hour-item {
      background: #172033;
      border: 1px solid #263449;
      border-radius: 7px;
      padding: 10px;
      display: flex;
      justify-content: space-between;
      gap: 8px;
      font-size: 11px;
    }

    .hour-label {
      color: #94a3b8;
    }

    .hour-count {
      color: #facc15;
      font-weight: bold;
    }

    .status {
      color: #94a3b8;
      font-size: 11px;
      margin-top: 12px;
      text-align: center;
    }

    @media (min-width: 700px) {
      body {
        padding: 24px;
      }

      .cards {
        grid-template-columns: repeat(3, 1fr);
      }

      th,
      td {
        font-size: 13px;
        padding: 12px 10px;
      }

      .type-badge {
        font-size: 11px;
        padding: 5px 8px;
      }

      .hourly-list {
        grid-template-columns: repeat(4, 1fr);
      }
    }
  </style>
</head>

<body>

<div class="container">

  <header>
    <div>
      <h1>MONOPOLY BIG BALLER</h1>
      <div class="subtitle">LIVE RESULTS TRACKER</div>
    </div>

    <button class="refresh-btn" onclick="loadRecords()">
      ↻ Refresh
    </button>
  </header>

  <!-- SUMMARY CARDS -->

  <div class="cards">

    <div class="card">
      <div class="card-title">TOTAL RECORDS</div>
      <div class="card-value" id="totalRecords">0</div>
    </div>

    <div class="card">
      <div class="card-title">3 ROLLS</div>
      <div class="card-value" id="threeRolls">0</div>
    </div>

    <div class="card">
      <div class="card-title">5 ROLLS</div>
      <div class="card-value" id="fiveRolls">0</div>
    </div>

  </div>

  <!-- HISTORICAL RECORDS -->

  <div class="section">

    <div class="section-header">
      <h2>Historical Records</h2>
    </div>

    <div class="filters">

      <button class="filter-btn active" data-type="all">
        All
      </button>

      <button class="filter-btn" data-type="three">
        3 Rolls
      </button>

      <button class="filter-btn" data-type="five">
        5 Rolls
      </button>

    </div>

    <div class="table-wrap">

      <table>

        <thead>
          <tr>
            <th>Event Type</th>
            <th>Host</th>
            <th>Multiplier</th>
            <th>Settled Time</th>
            <th>Adjusted Time</th>
          </tr>
        </thead>

        <tbody id="records">

          <tr>
            <td colspan="5" class="empty">
              Loading records...
            </td>
          </tr>

        </tbody>

      </table>

    </div>

    <div id="pagination" class="pagination"></div>

    <div class="status" id="recordStatus">
      Waiting for data...
    </div>

  </div>

  <!-- HOURLY STATISTICS -->

  <div class="section">

    <div class="section-header">
      <h2>Hourly Statistics</h2>
    </div>

    <div class="hourly-list" id="hourlyStats">
      <div class="empty">Loading statistics...</div>
    </div>

  </div>

</div>

<script>

'use strict';

let currentType = 'all';
let currentPage = 1;

const recordsPerPage = 20;

let allRecords = [];


// SAFE TEXT

function escapeHTML(value) {
  return String(value ?? '').replace(/[&<>"']/g, function(char) {
    return {
      '&': '&amp;',
      '<': '&lt;',
      '>': '&gt;',
      '"': '&quot;',
      "'": '&#039;'
    }[char];
  });
}


// DATE FORMAT

function formatDate(value) {

  if (!value) return '-';

  const date = new Date(value);

  if (isNaN(date.getTime())) return '-';

  return date.toLocaleString('en-PH', {
    month: 'short',
    day: 'numeric',
    hour: '2-digit',
    minute: '2-digit',
    hour12: true
  });

}


// GET MULTIPLIER

function getMultiplier(record) {

  const value =
    record.big_win_multiplier ??
    record.multiplier ??
    record.three_multiplier ??
    record.five_multiplier;

  if (value === null || value === undefined || value === '') {
    return '-';
  }

  const number = Number(value);

  if (Number.isNaN(number)) {
    return escapeHTML(value);
  }

  return number + 'x';

}


// GET EVENT TYPE

function getEventType(record) {

  if (record.is_three_rolls) {
    return {
      label: '3 Rolls',
      badge: 'badge-three'
    };
  }

  if (record.is_five_rolls) {
    return {
      label: '5 Rolls',
      badge: 'badge-five'
    };
  }

  return {
    label: record.roll_type || 'Other',
    badge: ''
  };

}


// SUMMARY CARDS

function updateCards(records) {

  const three = records.filter(
    record => record.is_three_rolls
  ).length;

  const five = records.filter(
    record => record.is_five_rolls
  ).length;

  document.getElementById('totalRecords').textContent =
    records.length;

  document.getElementById('threeRolls').textContent =
    three;

  document.getElementById('fiveRolls').textContent =
    five;

}


// RENDER RECORDS

function renderRecords() {

  const tbody = document.getElementById('records');

  const pagination = document.getElementById('pagination');

  if (!allRecords.length) {

    tbody.innerHTML = `
      <tr>
        <td colspan="5" class="empty">
          No records found.
        </td>
      </tr>
    `;

    pagination.innerHTML = '';

    return;
  }

  const totalPages = Math.ceil(
    allRecords.length / recordsPerPage
  );

  if (currentPage > totalPages) {
    currentPage = totalPages;
  }

  const start = (currentPage - 1) * recordsPerPage;

  const pageRecords = allRecords.slice(
    start,
    start + recordsPerPage
  );

  tbody.innerHTML = pageRecords.map(record => {

    const event = getEventType(record);

    const host =
      record.dealer_name ||
      record.host_name ||
      '-';

    const settled =
      formatDate(record.settled_at);

    const adjusted =
      formatDate(record.adjusted_at);

    return `
      <tr>

        <td>
          <span class="type-badge ${event.badge}">
            ${escapeHTML(event.label)}
          </span>
        </td>

        <td>${escapeHTML(host)}</td>

        <td class="multiplier">
          ${escapeHTML(getMultiplier(record))}
        </td>

        <td>${escapeHTML(settled)}</td>

        <td>${escapeHTML(adjusted)}</td>

      </tr>
    `;

  }).join('');


  // PAGINATION BUTTONS

  let buttons = '';

  buttons += `
    <button
      onclick="changePage(${currentPage - 1})"
      ${currentPage === 1 ? 'disabled' : ''}
    >
      Previous
    </button>
  `;

  for (let page = 1; page <= totalPages; page++) {

    buttons += `
      <button
        class="${page === currentPage ? 'active' : ''}"
        onclick="changePage(${page})"
      >
        ${page}
      </button>
    `;

  }

  buttons += `
    <button
      onclick="changePage(${currentPage + 1})"
      ${currentPage === totalPages ? 'disabled' : ''}
    >
      Next
    </button>
  `;

  pagination.innerHTML = buttons;

  document.getElementById('recordStatus').textContent =
    `Showing ${start + 1}-${Math.min(start + recordsPerPage, allRecords.length)} of ${allRecords.length} records | Page ${currentPage} of ${totalPages}`;

}


// CHANGE PAGE

function changePage(page) {

  const totalPages = Math.ceil(
    allRecords.length / recordsPerPage
  );

  if (page < 1 || page > totalPages) {
    return;
  }

  currentPage = page;

  renderRecords();

}


// HOURLY STATISTICS

function renderHourlyStats(records) {

  const container = document.getElementById('hourlyStats');

  const hours = {};

  for (let i = 0; i < 24; i++) {

    const label = String(i).padStart(2, '0') + ':00';

    hours[label] = 0;

  }

  records.forEach(record => {

    if (!record.settled_at) return;

    const date = new Date(record.settled_at);

    if (isNaN(date.getTime())) return;

    const hour = String(date.getHours()).padStart(2, '0') + ':00';

    hours[hour]++;

  });

  container.innerHTML = Object.entries(hours).map(
    ([hour, count]) => {

      return `
        <div class="hour-item">
          <span class="hour-label">${hour}</span>
          <span class="hour-count">${count}</span>
        </div>
      `;

    }
  ).join('');

}


// LOAD RECORDS

async function loadRecords() {

  const tbody = document.getElementById('records');

  const pagination = document.getElementById('pagination');

  tbody.innerHTML = `
    <tr>
      <td colspan="5" class="empty">
        Loading records...
      </td>
    </tr>
  `;

  try {

    const response = await fetch(
      `/api/history?type=${currentType}&limit=200`
    );

    if (!response.ok) {
      throw new Error('Records request failed');
    }

    const data = await response.json();

    allRecords = data.records || [];

    updateCards(allRecords);

    renderRecords();

    renderHourlyStats(allRecords);

  } catch (error) {

    tbody.innerHTML = `
      <tr>
        <td colspan="5" class="empty">
          Unable to load records.
        </td>
      </tr>
    `;

    pagination.innerHTML = '';

    document.getElementById('recordStatus').textContent =
      'Connection error. Please refresh.';

    console.error('Load Records Error:', error);

  }

}


// FILTER BUTTONS

document.querySelectorAll('[data-type]').forEach(button => {

  button.addEventListener('click', () => {

    document.querySelectorAll('[data-type]').forEach(item => {
      item.classList.remove('active');
    });

    button.classList.add('active');

    currentType = button.dataset.type;

    currentPage = 1;

    loadRecords();

  });

});


// INITIAL LOAD

loadRecords();


// AUTO REFRESH EVERY 30 SECONDS

setInterval(() => {

  loadRecords();

}, 30000);

</script>

</body>
</html>
